# Local development only. Never expose these services on a public interface.
name: musemint-dev
services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: musemint
      POSTGRES_DB: musemint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/dev.py setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musemint -d musemint"]
      interval: 2s
      timeout: 3s
      retries: 30
  chain:
    image: ghcr.io/foundry-rs/foundry:v1.3.1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--silent"]
    ports:
      - "127.0.0.1:8545:8545"
volumes:
  postgres-data:
